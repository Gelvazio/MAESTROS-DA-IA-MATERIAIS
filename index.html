  <script>
    function normalizar(texto) {
      return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function escapar(texto) {
      return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function textoBuscavel(dica) {
      const ferramentas = Array.isArray(dica.ferramentas_citadas) ? dica.ferramentas_citadas.join(" ") : "";
      return normalizar([dica.titulo, dica.descricao, dica.categoria, ferramentas].join(" "));
    }

    function filtrarDicas(dicas, termo, categoria) {
      const q = normalizar(termo).trim();
      return dicas.filter(function (dica) {
        const okCat = !categoria || dica.categoria === categoria;
        const okTermo = !q || textoBuscavel(dica).indexOf(q) !== -1;
        return okCat && okTermo;
      });
    }

    function categoriasDe(dicas) {
      const set = {};
      dicas.forEach(function (d) {
        if (d.categoria) set[d.categoria] = true;
      });
      return Object.keys(set).sort(function (a, b) {
        return a.localeCompare(b, "pt-BR");
      });
    }

    function formatarData(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return new Intl.DateTimeFormat("pt-BR", {
        dateStyle: "short",
        timeStyle: "short",
        timeZone: "America/Sao_Paulo"
      }).format(d) + " (horário de Brasília)";
    }

    function renderizarCards(lista) {
      const box = document.getElementById("resultados");
      if (!lista.length) {
        box.innerHTML = '<p class="vazio">Nenhuma dica encontrada para essa busca.</p>';
        return;
      }
      box.innerHTML = lista.map(function (dica) {
        const tools = (dica.ferramentas_citadas || []).map(function (t) {
          return '<span class="tool">' + escapar(t) + "</span>";
        }).join("");
        const href = dica.url_origem ? escapar(dica.url_origem) : "#";
        return (
          '<article class="card">' +
            (dica.categoria ? '<div class="cat">' + escapar(dica.categoria) + "</div>" : "") +
            "<h2>" + escapar(dica.titulo) + "</h2>" +
            "<p>" + escapar(dica.descricao) + "</p>" +
            (tools ? '<div class="tools">' + tools + "</div>" : "") +
            (dica.url_origem ? '<a href="' + href + '" target="_blank" rel="noopener noreferrer">Abrir origem</a>' : "") +
          "</article>"
        );
      }).join("");
    }

    function atualizarContagem(visiveis, total) {
      const el = document.getElementById("contagem");
      if (visiveis === total) {
        el.innerHTML = "<strong>" + visiveis + "</strong> dica" + (visiveis === 1 ? "" : "s") + " no acervo";
      } else {
        el.innerHTML = "<strong>" + visiveis + "</strong> de " + total + " dicas encontradas";
      }
    }

    var estado = { dicas: [], categoria: "", termo: "" };

    function redesenhar() {
      const filtradas = filtrarDicas(estado.dicas, estado.termo, estado.categoria);
      atualizarContagem(filtradas.length, estado.dicas.length);
      renderizarCards(filtradas);
    }

    function montarChips(dicas) {
      const wrap = document.getElementById("chips");
      const cats = ["Todas"].concat(categoriasDe(dicas));
      wrap.innerHTML = cats.map(function (nome, i) {
        const valor = i === 0 ? "" : nome;
        const pressed = (estado.categoria === valor) ? "true" : "false";
        return '<button type="button" class="chip" data-cat="' + escapar(valor) + '" aria-pressed="' + pressed + '">' + escapar(nome) + "</button>";
      }).join("");
      wrap.addEventListener("click", function (ev) {
        const btn = ev.target.closest(".chip");
        if (!btn) return;
        estado.categoria = btn.getAttribute("data-cat") || "";
        wrap.querySelectorAll(".chip").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        redesenhar();
      });
    }

    function iniciar(dados, origem) {
      estado.dicas = Array.isArray(dados && dados.dicas) ? dados.dicas : [];
      const fonte = document.getElementById("fonte-link");
      if (dados && dados.fonte) {
        fonte.href = dados.fonte;
        fonte.textContent = dados.fonte.replace(/^https?:\/\//, "");
      }
      document.getElementById("extraido-em").textContent = formatarData(dados && dados.extraido_em);
      montarChips(estado.dicas);
      document.getElementById("busca").addEventListener("input", function (ev) {
        estado.termo = ev.target.value;
        redesenhar();
      });
      redesenhar();
      if (origem === "embutido") {
        const aviso = document.getElementById("aviso");
        aviso.style.display = "block";
        aviso.textContent = "Não foi possível carregar dados.json; usando a cópia embutida nesta página.";
      }
    }

    function lerEmbutido() {
      const el = document.getElementById("dados-embutidos");
      return JSON.parse(el.textContent);
    }

    function carregar() {
      const aviso = document.getElementById("aviso");
      fetch("dados.json")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (dados) { iniciar(dados, "arquivo"); })
        .catch(function () {
          try {
            iniciar(lerEmbutido(), "embutido");
          } catch (err) {
            aviso.style.display = "block";
            aviso.textContent = "Não foi possível ler os dados das dicas.";
          }
        });
    }

    if (typeof window !== "undefined") {
      window.DicasIA = { normalizar: normalizar, filtrarDicas: filtrarDicas, categoriasDe: categoriasDe, lerEmbutido: lerEmbutido };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", carregar);
      else carregar();
    }
  </script>
</body>
</html>
